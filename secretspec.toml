# Declarative secret *requirements* for this repo, resolved at runtime by
# secretspec (github:cachix/secretspec). This file names secrets and where to
# find them -- it never contains values, which is why it is checked in.
#
# The provider is set once, per machine, in ~/.config/secretspec/config.toml
# (generated by modules/secretspec.nix) and points at our own Vaultwarden:
#
#   provider = "bw://?server=https://vw.w.phonkd.net"
#
# Usage, from anywhere inside this repo:
#
#   bwu                                   # unlock the vault, export BW_SESSION
#   secretspec check                      # are all required secrets resolvable?
#   secretspec get S3_ACCESS_KEY_ID       # print one
#   secretspec run -- aws s3 ls           # run a command with them in the env
#
# This is deliberately NOT how the homelab hosts get their secrets -- those are
# sops-nix, decrypted at activation into /run/secrets (see
# modules/homelab/global-secrets/). secretspec covers the other case: secrets a
# *human at a terminal* needs, which sops-nix has no story for.
[project]
name = "nixconfig"
revision = "1.0"

# "agents" (the default, explicit here so the behaviour isn't a surprise):
# secretspec demands `--reason "..."` when it detects it is being driven by a
# coding agent rather than a human, and records it in ~/.local/state/secretspec/audit.log.
require_reason = "agents"

[profiles.default]
# Garage S3 (modules/homelab/apps/s3-garage.nix, api.s3.w.phonkd.net).
#
# Both halves live on ONE Bitwarden login item named "Garage S3": the access
# key ID is its username, the secret key its password. Hence the explicit
# `ref` -- without it secretspec would look for two separate vault items named
# after the keys, which is its default convention. Item names are matched in
# full and case-insensitively.
S3_ACCESS_KEY_ID = { description = "Garage S3 access key ID", ref = { item = "Garage S3", field = "username" } }
S3_SECRET_ACCESS_KEY = { description = "Garage S3 secret access key", ref = { item = "Garage S3", field = "password" } }
