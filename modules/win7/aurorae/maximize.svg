<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aero7 maximize button. See minimize.svg for the state/geometry contract.
  Glyph shapes are written out per state rather than shared through <use>:
  Qt's SVG renderer is a Tiny-profile parser and referencing defs across
  states is exactly the kind of thing it is unreliable about.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="17" version="1.1">
  <defs>
    <linearGradient id="g-active" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="17">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="0.5"  stop-color="#e2eefb" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#c6dcf3" stop-opacity="0.30"/>
      <stop offset="1"    stop-color="#e8f2fd" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="g-hover" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="17">
      <stop offset="0"    stop-color="#f6fbff" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#cbe7fd" stop-opacity="0.88"/>
      <stop offset="0.52" stop-color="#a5d3f8" stop-opacity="0.86"/>
      <stop offset="1"    stop-color="#d3ecff" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="g-pressed" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="17">
      <stop offset="0"    stop-color="#7fb0da" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#9cc6e9" stop-opacity="0.90"/>
      <stop offset="1"    stop-color="#c2ddf3" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="g-inactive" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="17">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#dde9f5" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <g id="active-center">
    <rect x="0.5" y="0.5" width="25" height="16" rx="2"
          fill="url(#g-active)" stroke="#ffffff" stroke-opacity="0.60" stroke-width="1"/>
    <rect x="8.4" y="5.6" width="9.2" height="7.8" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="7.8" y="5" width="10.4" height="2.2" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="8.4" y="4.6" width="9.2" height="7.8" fill="none" stroke="#1c3a5a" stroke-width="1.2"/>
    <rect x="7.8" y="4" width="10.4" height="2.2" fill="#1c3a5a"/>
  </g>

  <g id="hover-center">
    <rect x="0.5" y="0.5" width="25" height="16" rx="2"
          fill="url(#g-hover)" stroke="#ffffff" stroke-opacity="0.90" stroke-width="1"/>
    <rect x="1.5" y="1.5" width="23" height="14" rx="1.5"
          fill="none" stroke="#8fcaf6" stroke-opacity="0.75" stroke-width="1"/>
    <rect x="8.4" y="5.6" width="9.2" height="7.8" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.2"/>
    <rect x="7.8" y="5" width="10.4" height="2.2" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="8.4" y="4.6" width="9.2" height="7.8" fill="none" stroke="#12293f" stroke-width="1.2"/>
    <rect x="7.8" y="4" width="10.4" height="2.2" fill="#12293f"/>
  </g>

  <g id="pressed-center">
    <rect x="0.5" y="0.5" width="25" height="16" rx="2"
          fill="url(#g-pressed)" stroke="#5b8bb5" stroke-opacity="0.85" stroke-width="1"/>
    <rect x="8.4" y="4.6" width="9.2" height="7.8" fill="none" stroke="#12293f" stroke-width="1.2"/>
    <rect x="7.8" y="4" width="10.4" height="2.2" fill="#12293f"/>
  </g>

  <g id="inactive-center">
    <rect x="0.5" y="0.5" width="25" height="16" rx="2"
          fill="url(#g-inactive)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="8.4" y="4.6" width="9.2" height="7.8" fill="none" stroke="#5d7186" stroke-opacity="0.85" stroke-width="1.2"/>
    <rect x="7.8" y="4" width="10.4" height="2.2" fill="#5d7186" fill-opacity="0.85"/>
  </g>

  <g id="deactivated-center">
    <rect x="0.5" y="0.5" width="25" height="16" rx="2"
          fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <rect x="8.4" y="4.6" width="9.2" height="7.8" fill="none" stroke="#7c8a97" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="7.8" y="4" width="10.4" height="2.2" fill="#7c8a97" fill-opacity="0.45"/>
  </g>
</svg>
