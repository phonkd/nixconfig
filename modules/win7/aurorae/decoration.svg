<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aero7 window decoration for KWin's Aurorae engine.

  Aurorae renders this file element-by-element: it asks QSvgRenderer for the
  nine ids below and 9-slices them around the window (corners fixed, edges
  stretched, `decoration-center` behind the client area). So each <g>'s
  bounding box IS its slice geometry, and the numbers here have to agree with
  Aero7rc:

      Padding*  10   drop shadow, painted OUTSIDE the window frame
      Border*    8   left/right/bottom glass frame
      top row   30   = TitleEdgeTop 3 + TitleHeight 24 + TitleEdgeBottom 3

  so the frame itself lives at x 10..210, y 10..150 on this canvas and every
  slice = padding band + frame band.

  The shadow is drawn as plain gradient rects that stop where the glass starts.
  Two reasons it is done the long way instead of a blur: Qt's SVG renderer
  ignores filters entirely, and the glass is translucent, so a shadow painted
  underneath it would show through and dirty the frame.

  Every group opens with a near-invisible `slice` rect covering exactly its
  region, pinning the bounding box instead of leaving it to how stroke extents
  happen to be measured.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="160" version="1.1">
  <defs>
    <!-- Titlebar glass: bright top, a darker band across the middle where Aero
         put its reflection break, then a slight lift again at the bottom.
         userSpaceOnUse so all three top slices share one continuous ramp even
         though only the middle one gets stretched. -->
    <linearGradient id="glass-title" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="40">
      <stop offset="0"    stop-color="#f2f8ff" stop-opacity="0.88"/>
      <stop offset="0.46" stop-color="#d3e5f7" stop-opacity="0.74"/>
      <stop offset="0.52" stop-color="#bad4ed" stop-opacity="0.72"/>
      <stop offset="1"    stop-color="#dfecfb" stop-opacity="0.80"/>
    </linearGradient>
    <!-- Side borders ramp ACROSS the border, i.e. constant along the axis
         Aurorae stretches, so stretching cannot smear them. -->
    <linearGradient id="glass-left" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="18" y2="0">
      <stop offset="0" stop-color="#cfe1f4" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#e6f0fb" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="glass-right" gradientUnits="userSpaceOnUse" x1="202" y1="0" x2="210" y2="0">
      <stop offset="0" stop-color="#e6f0fb" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#cfe1f4" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="glass-bottom" gradientUnits="userSpaceOnUse" x1="0" y1="142" x2="0" y2="150">
      <stop offset="0" stop-color="#e6f0fb" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#cfe1f4" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Drop shadow: lighter above the window, heaviest below it. -->
    <linearGradient id="sh-top" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="10">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="sh-bottom" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="160">
      <stop offset="0" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh-left" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="10" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="sh-right" gradientUnits="userSpaceOnUse" x1="210" y1="0" x2="220" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sh-tl" gradientUnits="userSpaceOnUse" cx="10" cy="10" r="10">
      <stop offset="0" stop-color="#000000" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh-tr" gradientUnits="userSpaceOnUse" cx="210" cy="10" r="10">
      <stop offset="0" stop-color="#000000" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh-bl" gradientUnits="userSpaceOnUse" cx="10" cy="150" r="10">
      <stop offset="0" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh-br" gradientUnits="userSpaceOnUse" cx="210" cy="150" r="10">
      <stop offset="0" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============================ top row ============================ -->
  <g id="decoration-topleft">
    <rect x="0" y="0" width="18" height="40" fill="#ffffff" fill-opacity="0.004"/>
    <rect x="0" y="0" width="10" height="10" fill="url(#sh-tl)"/>
    <rect x="10" y="0" width="8" height="10" fill="url(#sh-top)"/>
    <rect x="0" y="10" width="10" height="30" fill="url(#sh-left)"/>
    <path d="M 10.5,40 V 16.5 A 6,6 0 0 1 16.5,10.5 H 18 V 40 Z"
          fill="url(#glass-title)" stroke="#42618a" stroke-opacity="0.85" stroke-width="1"/>
    <path d="M 11.5,40 V 16.8 A 5,5 0 0 1 16.8,11.5 H 18"
          fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  </g>
  <g id="decoration-top">
    <rect x="18" y="0" width="184" height="40" fill="#ffffff" fill-opacity="0.004"/>
    <rect x="18" y="0" width="184" height="10" fill="url(#sh-top)"/>
    <rect x="18" y="10.5" width="184" height="29.5" fill="url(#glass-title)"/>
    <path d="M 18,10.5 H 202" stroke="#42618a" stroke-opacity="0.85" stroke-width="1" fill="none"/>
    <path d="M 18,11.5 H 202" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" fill="none"/>
  </g>
  <g id="decoration-topright">
    <rect x="202" y="0" width="18" height="40" fill="#ffffff" fill-opacity="0.004"/>
    <rect x="210" y="0" width="10" height="10" fill="url(#sh-tr)"/>
    <rect x="202" y="0" width="8" height="10" fill="url(#sh-top)"/>
    <rect x="210" y="10" width="10" height="30" fill="url(#sh-right)"/>
    <path d="M 209.5,40 V 16.5 A 6,6 0 0 0 203.5,10.5 H 202 V 40 Z"
          fill="url(#glass-title)" stroke="#42618a" stroke-opacity="0.85" stroke-width="1"/>
    <path d="M 208.5,40 V 16.8 A 5,5 0 0 0 203.2,11.5 H 202"
          fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  </g>

  <!-- ========================== middle row =========================== -->
  <g id="decoration-left">
    <rect x="0" y="40" width="18" height="102" fill="#ffffff" fill-opacity="0.004"/>
    <rect x="0" y="40" width="10" height="102" fill="url(#sh-left)"/>
    <rect x="10.5" y="40" width="7.5" height="102" fill="url(#glass-left)"/>
    <path d="M 10.5,40 V 142" stroke="#42618a" stroke-opacity="0.85" stroke-width="1" fill="none"/>
    <path d="M 17.5,40 V 142" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" fill="none"/>
  </g>
  <!-- The client is painted over this, so it must stay clear. -->
  <g id="decoration-center">
    <rect x="18" y="40" width="184" height="102" fill="#ffffff" fill-opacity="0.004"/>
  </g>
  <g id="decoration-right">
    <rect x="202" y="40" width="18" height="102" fill="#ffffff" fill-opacity="0.004"/>
    <rect x="210" y="40" width="10" height="102" fill="url(#sh-right)"/>
    <rect x="202" y="40" width="7.5" height="102" fill="url(#glass-right)"/>
    <path d="M 209.5,40 V 142" stroke="#42618a" stroke-opacity="0.85" stroke-width="1" fill="none"/>
    <path d="M 202.5,40 V 142" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" fill="none"/>
  </g>

  <!-- ========================== bottom row =========================== -->
  <g id="decoration-bottomleft">
    <rect x="0" y="142" width="18" height="18" fill="#ffffff" fill-opacity="0.004"/>
    <rect x="0" y="142" width="10" height="8" fill="url(#sh-left)"/>
    <rect x="0" y="150" width="10" height="10" fill="url(#sh-bl)"/>
    <rect x="10" y="150" width="8" height="10" fill="url(#sh-bottom)"/>
    <path d="M 10.5,142 V 143.5 A 6,6 0 0 0 16.5,149.5 H 18 V 142 Z"
          fill="url(#glass-bottom)" stroke="#42618a" stroke-opacity="0.85" stroke-width="1"/>
    <path d="M 11.5,142 V 143.8 A 5,5 0 0 0 16.8,148.5 H 18"
          fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  </g>
  <g id="decoration-bottom">
    <rect x="18" y="142" width="184" height="18" fill="#ffffff" fill-opacity="0.004"/>
    <rect x="18" y="150" width="184" height="10" fill="url(#sh-bottom)"/>
    <rect x="18" y="142" width="184" height="7.5" fill="url(#glass-bottom)"/>
    <path d="M 18,149.5 H 202" stroke="#42618a" stroke-opacity="0.85" stroke-width="1" fill="none"/>
    <path d="M 18,142.5 H 202" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1" fill="none"/>
  </g>
  <g id="decoration-bottomright">
    <rect x="202" y="142" width="18" height="18" fill="#ffffff" fill-opacity="0.004"/>
    <rect x="210" y="142" width="10" height="8" fill="url(#sh-right)"/>
    <rect x="210" y="150" width="10" height="10" fill="url(#sh-br)"/>
    <rect x="202" y="150" width="8" height="10" fill="url(#sh-bottom)"/>
    <path d="M 209.5,142 V 143.5 A 6,6 0 0 1 203.5,149.5 H 202 V 142 Z"
          fill="url(#glass-bottom)" stroke="#42618a" stroke-opacity="0.85" stroke-width="1"/>
    <path d="M 208.5,142 V 143.8 A 5,5 0 0 1 203.2,148.5 H 202"
          fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  </g>
</svg>
